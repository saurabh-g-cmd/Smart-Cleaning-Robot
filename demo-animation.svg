<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Smart Mopping Robot working animation</title>
<desc>Looping animation of the robot driving forward, detecting an obstacle with its ultrasonic sensor, stopping, turning away, and continuing.</desc>
<rect width="680" height="260" fill="#FFFFFF"/>
<line x1="30" y1="210" x2="650" y2="210" stroke="#B4B2A9" stroke-width="1.5"/>
<rect x="560" y="140" width="34" height="70" rx="4" fill="#B4B2A9"/>
<text x="577" y="130" text-anchor="middle" font-size="12" fill="#5F5E5A" font-family="sans-serif">obstacle</text>
<g id="robot">
  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 0,0; 460,0; 460,0; 430,-40; 430,-40; 430,-40"
      keyTimes="0; 0.05; 0.42; 0.55; 0.72; 0.9; 1"
      dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0 60 190; 0 60 190; 0 60 190; 0 60 190; -35 60 190; -35 60 190; 0 60 190"
      keyTimes="0; 0.05; 0.42; 0.55; 0.72; 0.9; 1"
      dur="6s" repeatCount="indefinite"/>
    <circle cx="45" cy="205" r="9" fill="#444441"/>
    <circle cx="95" cy="205" r="9" fill="#444441"/>
    <rect x="30" y="165" width="80" height="40" rx="10" fill="#E6F1FB" stroke="#0C447C" stroke-width="2"/>
    <circle cx="48" cy="182" r="6" fill="#0C447C"/>
    <circle cx="72" cy="182" r="6" fill="#0C447C"/>
    <rect x="40" y="196" width="60" height="5" rx="2" fill="#1D9E75"/>
    <path d="M110,178 A20,20 0 0,1 110,192" fill="none" stroke="#378ADD" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M110,170 A30,30 0 0,1 110,200" fill="none" stroke="#378ADD" stroke-width="2" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
<text x="470" y="120" text-anchor="middle" font-size="13" fill="#791F1F" opacity="0" font-family="sans-serif">
  stop &#8594; turn
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.68;0.75" dur="6s" repeatCount="indefinite"/>
</text>
</svg>
